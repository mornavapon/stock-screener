<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Stock Screener</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: #020617 !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #0f172a !important;
            border-right: 1px solid #334155;
        }
        thead .sticky-col {
            z-index: 40;
            background-color: #020617 !important;
        }
        .max-h-screen-table {
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            overflow-x: auto;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                📈 Stock Screener PWA
            </h1>
            <div class="flex gap-2">
                <button id="btn-tab-filter" onclick="switchTab('filter')" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg text-sm transition">ตัวกรองหุ้น</button>
                <button id="btn-tab-results" onclick="switchTab('results')" class="px-4 py-2 bg-slate-700 text-slate-200 font-medium rounded-lg text-sm transition">ผลลัพธ์ (<span id="summary-count">0</span>)</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        
        <!-- Tab 1: Filter Setup -->
        <section id="tab-filter" class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
                <h2 class="text-md font-semibold text-slate-200 border-b border-slate-800 pb-2">🎯 ตั้งค่าเงื่อนไขการกรองหุ้น</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Market Universe</label>
                        <select id="filter-universe" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                            <option value="SP500">S&P 500 (US)</option>
                            <option value="SET">SET (Thailand)</option>
                            <option value="WATCHLIST">Watchlist (Custom)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Sector</label>
                        <select id="filter-sector" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                            <option value="ALL">All Sectors</option>
                            <option value="Technology">Technology</option>
                            <option value="Financial Services">Financial Services</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Consumer Cyclical">Consumer Cyclical</option>
                            <option value="Energy">Energy</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Watchlist Tickers (คั่นด้วยคอมม่า)</label>
                        <input type="text" id="filter-watchlist" placeholder="เช่น AAPL, MSFT, PTT" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                </div>

                <!-- Financial Metrics Filters -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">ROE Min (%)</label>
                        <input type="number" id="filter-roe" placeholder="เช่น 15" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">D/E Max</label>
                        <input type="number" id="filter-de" placeholder="เช่น 1.5" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">P/E Max</label>
                        <input type="number" id="filter-pe" placeholder="เช่น 30" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Div Yield Min (%)</label>
                        <input type="number" id="filter-div" placeholder="เช่น 2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">GPM Min (%)</label>
                        <input type="number" id="filter-gpm" placeholder="เช่น 20" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">NPM Min (%)</label>
                        <input type="number" id="filter-npm" placeholder="เช่น 10" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">P/BV Max</label>
                        <input type="number" id="filter-pbv" placeholder="เช่น 3" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button onclick="resetFilters()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg transition">รีเซ็ต</button>
                    <button onclick="applyFilters(); switchTab('results');" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg shadow transition">🔍 กรองหุ้นทันที</button>
                </div>
            </div>
        </section>

        <!-- Tab 2: Results Table -->
        <section id="tab-results" class="hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap justify-between items-center gap-2">
                <div id="results-summary-tags" class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="font-semibold text-blue-400">Active Filters:</span>
                </div>
                <div class="text-sm text-slate-300">
                    พบหุ้นที่ตรงเงื่อนไข: <span id="match-count" class="font-bold text-emerald-400">0</span> ตัว
                </div>
            </div>

            <!-- Table Container -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl max-h-screen-table">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="sticky-header text-slate-300 text-xs uppercase tracking-wider select-none">
                        <tr>
                            <th class="p-3 text-left sticky-col border-r border-slate-700/80 bg-[#020617]">
                                <div class="flex items-center justify-between cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('ticker')">
                                    <span>Ticker / Name</span>
                                    <span class="flex flex-col text-[10px] leading-none text-emerald-500 ml-1">▲<br>▼</span>
                                </div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('price')">
                                <div class="flex items-center gap-1"><span>Price</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('mcap')">
                                <div class="flex items-center gap-1"><span>Market Cap</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('pe')">
                                <div class="flex items-center gap-1"><span>P/E</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('pbv')">
                                <div class="flex items-center gap-1"><span>P/BV</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('divYield')">
                                <div class="flex items-center gap-1"><span>Div Yield (%)</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('roe')">
                                <div class="flex items-center gap-1"><span>ROE (%)</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('de')">
                                <div class="flex items-center gap-1"><span>D/E</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('gpm')">
                                <div class="flex items-center gap-1"><span>GPM (%)</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                            <th class="p-3 text-left cursor-pointer hover:text-emerald-400 transition" onclick="sortTable('npm')">
                                <div class="flex items-center gap-1"><span>NPM (%)</span><span class="flex flex-col text-[10px] leading-none text-emerald-500">▲<br>▼</span></div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-800 text-slate-200">
                        <!-- โหลดข้อมูลด้วย JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Action Popup -->
    <div id="action-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <div>
                <h3 id="modal-ticker" class="text-lg font-bold text-blue-400"></h3>
                <p id="modal-name" class="text-xs text-slate-400 truncate"></p>
            </div>
            <div class="grid grid-cols-1 gap-2">
                <button id="btn-financials" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg transition">📊 ดูงบการเงิน / งบย้อนหลัง</button>
                <button id="btn-chart" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg transition">📈 ดูกราฟ TradingView</button>
                <button id="btn-gemini" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition">🤖 ให้ AI วิเคราะห์หุ้นตัวนี้</button>
            </div>
            <button onclick="closeModal()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-medium rounded-lg transition">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
