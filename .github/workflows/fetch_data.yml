name: Daily Stock Data Update

on:
  schedule:
    - cron: '0 0 * * *' # รันอัตโนมัติทุกวันตอนเที่ยงคืน UTC
  workflow_dispatch: # อนุญาตให้กดรันด้วยมือ (Manual Trigger) ได้ตลอดเวลา

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance

      - name: Run Fetcher Script
        run: python scripts/fetch_yahoo.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git commit -m "auto: update stock data from yahoo finance [skip ci]" || exit 0
          git push
